<!DOCTYPE html>
<html lang="pt-BR" style="--bg: #ffffff; --text: #0d0d0d;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Révian — Em breve</title>
  <meta name="description" content="Révian — Em breve.">

  <!-- Fontes em estilo próximo ao layout de referência -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ead2ad;
      --text: #0d0d0d;
      --muted: #211f1c;
      --panel: rgba(255,255,255,.84);
      --line: rgba(0,0,0,.16);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', Arial, sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 22px 42px;
      position: relative;
      text-align: center;
    }

    .brand {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(165px, 15vw, 195px);
      z-index: 2;
    }

    .brand img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 1;
      filter: none;
      mix-blend-mode: normal;
    }

    .hero {
      width: min(980px, 100%);
      margin-top: 22px;
    }

    .eyebrow {
      margin: 0 0 24px;
      font-size: 12px;
      letter-spacing: .34em;
      text-transform: uppercase;
      font-weight: 600;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(62px, 12vw, 142px);
      line-height: .72;
      letter-spacing: -0.055em;
      margin: 0;
      text-transform: uppercase;
    }

    .subtitle {
      max-width: 670px;
      margin: 40px auto 0;
      font-size: clamp(16px, 2.1vw, 23px);
      line-height: 1.55;
      font-weight: 500;
      letter-spacing: .025em;
    }

    .divider {
      width: 66px;
      height: 1px;
      background: #111;
      opacity: .72;
      margin: 34px auto 0;
    }

    .footer {
      position: absolute;
      bottom: 22px;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .72;
    }

    .editor-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      border: 1px solid rgba(0,0,0,.2);
      background: #111;
      color: #fff;
      border-radius: 999px;
      padding: 11px 15px;
      font: 600 12px/1 'Montserrat', sans-serif;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
    }

    .editor {
      position: fixed;
      top: 0;
      right: 0;
      width: min(380px, 92vw);
      height: 100vh;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-left: 1px solid var(--line);
      z-index: 30;
      padding: 22px;
      transform: translateX(101%);
      transition: transform .25s ease;
      overflow-y: auto;
      text-align: left;
    }

    .editor.open { transform: translateX(0); }
    .editor h2 {
      margin: 0 0 18px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }
    .field { margin-bottom: 15px; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .field input, .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.76);
      border-radius: 10px;
      padding: 10px 12px;
      font: 500 13px/1.45 'Montserrat', sans-serif;
      outline: none;
    }
    .field textarea { min-height: 92px; resize: vertical; }
    .field input[type="color"] { height: 42px; padding: 4px; }
    .field input[type="file"] { padding: 8px; cursor: pointer; }
    .range-row { display:flex; align-items:center; gap:10px; }
    .range-row input[type="range"] { flex:1; padding:0; }
    .range-value { min-width:58px; text-align:right; font-size:12px; font-weight:600; }
    .logo-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .logo-actions button { border:1px solid var(--line); border-radius:9px; padding:9px; background:rgba(255,255,255,.55); cursor:pointer; font:600 11px 'Montserrat',sans-serif; }

    .editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }
    .editor-actions button {
      border: 1px solid #111;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font: 600 12px 'Montserrat', sans-serif;
      background: transparent;
    }
    .editor-actions button.primary { background: #111; color: #fff; }
    .editor-actions .wide { grid-column: 1 / -1; }
    .editor-actions button.secondary { background: rgba(255,255,255,.58); }

    .hint {
      margin-top: 14px;
      font-size: 11px;
      line-height: 1.5;
      opacity: .68;
    }

    @media (max-width: 640px) {
      .page { padding-left: 18px; padding-right: 18px; }
      .brand { top: 18px; width: 165px; }
      .hero { margin-top: 36px; }
      h1 { line-height: .78; }
      .subtitle { margin-top: 30px; }
      .footer { bottom: 16px; }
    }

    /* Esboços artísticos Révian — cada elemento é editável individualmente */
    .sketch-layer {
      position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
      opacity:1; transition:opacity .2s ease;
    }
    .brand,.hero,.footer { z-index:2; }
    .hero,.footer { position:relative; }

    .art-sketch {
      --x: 10; --y: 10; --size: 220; --rot: 0; --op: .28;
      position:absolute;
      left:calc(var(--x) * 1%);
      top:calc(var(--y) * 1%);
      width:calc(var(--size) * 1px);
      transform:translate(-50%,-50%) rotate(calc(var(--rot) * 1deg));
      opacity:var(--op);
      fill:none;
      stroke:var(--text);
      stroke-width:1.15;
      stroke-linecap:round;
      stroke-linejoin:round;
      overflow:visible;
      transition:opacity .2s ease;
    }
    .art-sketch .fine { stroke-width:.72; opacity:.66; }
    .art-sketch .ghost { stroke-width:.55; opacity:.38; }
    .art-sketch path,.art-sketch ellipse,.art-sketch circle { vector-effect:non-scaling-stroke; }
    .art-sketch.is-hidden { display:none; }
    .sketch-layer.animated .draw-path {
      stroke-dasharray:520;
      stroke-dashoffset:520;
      animation:drawSketch 10s ease-in-out infinite;
    }
    .sketch-layer.animated .art-sketch:nth-child(2) .draw-path { animation-delay:1.2s; }
    .sketch-layer.animated .art-sketch:nth-child(3) .draw-path { animation-delay:2.1s; }
    .sketch-layer.animated .art-sketch:nth-child(4) .draw-path { animation-delay:3.0s; }
    .sketch-layer.animated .art-sketch:nth-child(5) .draw-path { animation-delay:3.8s; }
    .sketch-layer.animated .art-sketch:nth-child(6) .draw-path { animation-delay:4.6s; }
    @keyframes drawSketch {
      0%,12%{stroke-dashoffset:520;opacity:.08}
      48%,88%{stroke-dashoffset:0;opacity:1}
      100%{stroke-dashoffset:0;opacity:.5}
    }

    .sketch-card {
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      background:rgba(255,255,255,.38);
      margin-top:8px;
    }
    .sketch-card .mini-title {
      font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
      margin:0 0 9px;opacity:.7;
    }
    .sketch-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
    .sketch-grid .field { margin:0; }
    .sketch-select {
      width:100%; border:1px solid var(--line); background:rgba(255,255,255,.76);
      border-radius:10px; padding:10px 12px; font:500 13px 'Montserrat',sans-serif;
    }
    .sketch-status { font-size:10px; opacity:.62; margin-top:7px; line-height:1.4; }


    /* Novos motivos de perfumaria: frasco, rosa, brisa e folhas ao vento */
    .sketch-layer.animated .art-sketch:nth-child(7) .draw-path { animation-delay:.8s; }
    .sketch-layer.animated .art-sketch:nth-child(8) .draw-path { animation-delay:2.7s; }
    .sketch-layer.animated .art-sketch:nth-child(9) .draw-path { animation-delay:4.2s; }
    .sketch-layer.animated .art-sketch:nth-child(10) .draw-path { animation-delay:1.7s; }
    .sketch-layer.animated .art-sketch:nth-child(11) .draw-path { animation-delay:3.3s; }

    .wind-leaf, .mist-dot, .spray-line { transform-box: fill-box; transform-origin: center; }
    .sketch-layer.animated .wind-leaf.one { animation: leafPass 9s ease-in-out infinite; }
    .sketch-layer.animated .wind-leaf.two { animation: leafPass 11s ease-in-out 1.4s infinite reverse; }
    .sketch-layer.animated .wind-leaf.three { animation: leafPass 8s ease-in-out 2.8s infinite; }
    .sketch-layer.animated .mist-dot.one { animation: mistFloat 6.8s ease-in-out infinite; }
    .sketch-layer.animated .mist-dot.two { animation: mistFloat 7.8s ease-in-out 1.1s infinite reverse; }
    .sketch-layer.animated .mist-dot.three { animation: mistFloat 8.4s ease-in-out 2s infinite; }
    .sketch-layer.animated .spray-line { animation: sprayPulse 5.8s ease-in-out infinite; }
    @keyframes leafPass {
      0%,100% { transform: translate(0,0) rotate(0deg); opacity:.35; }
      45% { transform: translate(18px,-10px) rotate(7deg); opacity:1; }
      72% { transform: translate(30px,2px) rotate(-4deg); opacity:.65; }
    }
    @keyframes mistFloat {
      0%,100% { transform: translate(0,0) scale(.9); opacity:.25; }
      50% { transform: translate(10px,-12px) scale(1.12); opacity:.9; }
    }
    @keyframes sprayPulse {
      0%,100% { opacity:.2; transform:translateX(0); }
      45% { opacity:1; transform:translateX(7px); }
    }

    @media (max-width:650px){
      .art-sketch { width:calc(var(--size) * .72px); }
      .sketch-layer { opacity:.82; }
    }
  </style>
</head>
